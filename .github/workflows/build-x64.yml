name: Build Source.Python for Windows x86-64

# Dispatch-only Windows x86-64 pipeline for the four OrangeBox games whose
# x86-64 CMake support exists and whose pinned HL2SDK revisions ship the
# public/x64 tier libraries: Counter-Strike: Source (css), Day of Defeat:
# Source (dods), Half-Life 2: Deathmatch (hl2dm) and Team Fortress 2 (tf2).
# src/CMakeLists.txt hard-fails x86_64 for every other branch, which is why
# these four are the only choices.
#
# One manual run builds exactly ONE selected game - there is deliberately no
# matrix - so the Windows x86-64 port can be validated game by game. Choose
# which artifacts to produce:
#   * package_dll    - core.dll + source-python.dll (SP_HOOK_DIAG OFF)
#   * package_stable - a full, clean, runnable game package with the x86-64
#                      Python runtime and NO diagnostics/debug plugins/PDBs
#   * package_test   - a runnable game package built with -DSP_HOOK_DIAG=ON and
#                      bundled with the thirdparty-tools diagnostic plugins
# The workflow never starts on push or pull_request and never creates a
# release; artifacts are only downloadable from this Actions run.
#
# All compile-time third-party dependencies for Windows x86-64 are vendored in
# the repository, so a clean runner builds the DLLs directly. The
# redistributable x86-64 Python *runtime* (python313.dll and the x64 .pyd
# extensions) and the test-only diagnostic plugins come from the companion
# repository kittenks/Source.Python-thirdparty-tools-Winx64, which is checked
# out (read-only) by the packaging jobs.
#
# The 32-bit build-packages.yml pipeline is untouched, and this file exists
# only on the spWinx64 branch.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Game to build for Windows x86-64 (one game per run)'
        required: true
        default: css
        type: choice
        options:
          - css
          - dods
          - hl2dm
          - tf2
      github_proxy:
        description: 'Optional public GitHub proxy for the HL2SDK download, for example https://ghfast.top'
        required: false
        default: ''
        type: string
      package_dll:
        description: 'Produce the native DLL artifact (core.dll + source-python.dll, diagnostics OFF)'
        type: boolean
        default: true
      package_stable:
        description: 'Produce the clean stable game package (x86-64 runtime, no diagnostics)'
        type: boolean
        default: true
      package_test:
        description: 'Produce the diagnostic test game package (-HookDiag + debug plugins)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: source-python-win64-${{ github.ref }}-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  # The release (SP_HOOK_DIAG OFF) core is shared by the DLL artifact and the
  # stable game package, so build it once when either is requested.
  build-release:
    name: Build ${{ inputs.branch }} x86-64 (stable core)
    if: ${{ inputs.package_dll || inputs.package_stable }}
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SP_GITHUB_PROXY: ${{ inputs.github_proxy }}
      SP_BRANCH: ${{ inputs.branch }}
      # Disable the MSVC build-telemetry probe vctip.exe: on headless Windows
      # runners it can inherit the MSBuild/cl output pipe and never exit,
      # stalling the build until the job timeout (an orphan vctip process is
      # then killed). It is pure usage telemetry with no codegen effect. This
      # mirrors the thirdparty-tools Win64 CI fix.
      VCTIPDISABLE: '1'
    steps:
      - name: Check out Source.Python
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Record checked-out source revision
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          "SOURCEPYTHON_SOURCE_REVISION=$revision" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Show the resolved SDK pin
        shell: pwsh
        run: |
          $pins = Get-Content -LiteralPath ./scripts/ci/sdk-pins.json -Raw | ConvertFrom-Json
          $entry = $pins.PSObject.Properties[$env:SP_BRANCH].Value
          "branch       : $env:SP_BRANCH"
          "sdk commit   : $($entry.commit)"
          "sdk_lib      : $($entry.sdk_lib)"
          "sdk_lib_win64: $($entry.sdk_lib_win64)"
          if ([string]::IsNullOrWhiteSpace([string]$entry.sdk_lib_win64)) {
            throw "sdk-pins.json has no sdk_lib_win64 entry for '$env:SP_BRANCH'."
          }

      - name: Verify Source.Python source fixes
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./scripts/ci/verify-fixes.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE

      - name: Fetch the pinned HL2SDK
        shell: pwsh
        run: .\scripts\ci\fetch-hl2sdk.ps1 -Branch $env:SP_BRANCH -MirrorBase $env:SP_GITHUB_PROXY

      - name: Configure and build Windows x86-64 (SP_HOOK_DIAG OFF)
        shell: pwsh
        run: .\scripts\ci\build-windows.ps1 -Branch $env:SP_BRANCH -Architecture x86_64

      - name: Verify the DLLs are x86-64 PE images
        shell: pwsh
        run: |
          $directory = Join-Path $env:GITHUB_WORKSPACE "artifacts\native\$env:SP_BRANCH\windows-x86_64"
          foreach ($name in @('core.dll', 'source-python.dll')) {
            $path = Join-Path $directory $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "$name was not produced at '$path'." }
            $bytes = [IO.File]::ReadAllBytes($path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) { throw "$name is not an x86-64 PE image (machine 0x{0:x})." -f $machine }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$name x86-64 PE machine=0x{0:x} sha256=$hash" -f $machine
          }
          Get-Content -LiteralPath (Join-Path $directory 'build-info.json')

      - name: Upload the native DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-win64-${{ inputs.branch }}
          path: artifacts/native/${{ inputs.branch }}/windows-x86_64
          if-no-files-found: error
          retention-days: 90

  # The diagnostic (SP_HOOK_DIAG ON) core, only for the test package.
  build-diag:
    name: Build ${{ inputs.branch }} x86-64 (diagnostic core)
    if: ${{ inputs.package_test }}
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SP_GITHUB_PROXY: ${{ inputs.github_proxy }}
      SP_BRANCH: ${{ inputs.branch }}
      # Disable the MSVC build-telemetry probe vctip.exe: on headless Windows
      # runners it can inherit the MSBuild/cl output pipe and never exit,
      # stalling the build until the job timeout (an orphan vctip process is
      # then killed). It is pure usage telemetry with no codegen effect. This
      # mirrors the thirdparty-tools Win64 CI fix.
      VCTIPDISABLE: '1'
    steps:
      - name: Check out Source.Python
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Record checked-out source revision
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          "SOURCEPYTHON_SOURCE_REVISION=$revision" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Verify Source.Python source fixes
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./scripts/ci/verify-fixes.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE

      - name: Fetch the pinned HL2SDK
        shell: pwsh
        run: .\scripts\ci\fetch-hl2sdk.ps1 -Branch $env:SP_BRANCH -MirrorBase $env:SP_GITHUB_PROXY

      - name: Configure and build Windows x86-64 (SP_HOOK_DIAG ON)
        shell: pwsh
        run: .\scripts\ci\build-windows.ps1 -Branch $env:SP_BRANCH -Architecture x86_64 -HookDiag

      - name: Verify the diagnostic DLLs are x86-64 PE images
        shell: pwsh
        run: |
          $directory = Join-Path $env:GITHUB_WORKSPACE "artifacts\native\$env:SP_BRANCH\windows-x86_64-diag"
          foreach ($name in @('core.dll', 'source-python.dll')) {
            $path = Join-Path $directory $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "$name was not produced at '$path'." }
            $bytes = [IO.File]::ReadAllBytes($path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) { throw "$name is not an x86-64 PE image (machine 0x{0:x})." -f $machine }
          }
          $info = Get-Content -LiteralPath (Join-Path $directory 'build-info.json') -Raw | ConvertFrom-Json
          if (-not $info.hook_diag) { throw 'build-info.json reports hook_diag=false for the diagnostic build.' }
          if (-not [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $directory 'core.dll'))).Contains('first24')) {
            throw 'Diagnostic core.dll is missing the DYNAMICHOOKS_DIAG "first24" output.'
          }
          Get-Content -LiteralPath (Join-Path $directory 'build-info.json')

      - name: Upload the diagnostic native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-win64-${{ inputs.branch }}-diag
          path: artifacts/native/${{ inputs.branch }}/windows-x86_64-diag
          if-no-files-found: error
          retention-days: 90

  package-stable:
    name: Package ${{ inputs.branch }} stable game bundle
    if: ${{ inputs.package_stable }}
    needs: build-release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out Source.Python
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}
      - name: Check out the thirdparty-tools repository
        uses: actions/checkout@v4
        with:
          repository: kittenks/Source.Python-thirdparty-tools-Winx64
          ref: main
          path: _tools
          persist-credentials: false
      - name: Download the stable native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-win64-${{ inputs.branch }}
          path: artifacts/native/${{ inputs.branch }}/windows-x86_64
      - name: Reproduce the x86-64 Python runtime
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File .\_tools\scripts\fetch-python-runtime.ps1
      - name: Assemble the stable package
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File .\scripts\ci\package-windows-x64.ps1
          -Branch ${{ inputs.branch }} -Flavor stable
          -RuntimeDirectory .\_tools\artifacts\python-runtime-win64
      - name: Upload the stable game package
        uses: actions/upload-artifact@v4
        with:
          name: game-win64-${{ inputs.branch }}-stable
          path: dist
          if-no-files-found: error
          retention-days: 90

  package-test:
    name: Package ${{ inputs.branch }} test (diagnostic) game bundle
    if: ${{ inputs.package_test }}
    needs: build-diag
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out Source.Python
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}
      - name: Check out the thirdparty-tools repository
        uses: actions/checkout@v4
        with:
          repository: kittenks/Source.Python-thirdparty-tools-Winx64
          ref: main
          path: _tools
          persist-credentials: false
      - name: Download the diagnostic native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-win64-${{ inputs.branch }}-diag
          path: artifacts/native/${{ inputs.branch }}/windows-x86_64-diag
      - name: Reproduce the x86-64 Python runtime
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File .\_tools\scripts\fetch-python-runtime.ps1
      - name: Assemble the test package
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -File .\scripts\ci\package-windows-x64.ps1
          -Branch ${{ inputs.branch }} -Flavor test
          -RuntimeDirectory .\_tools\artifacts\python-runtime-win64
          -DiagPluginsDirectory .\_tools\debug\server-plugins
      - name: Upload the test game package
        uses: actions/upload-artifact@v4
        with:
          name: game-win64-${{ inputs.branch }}-test
          path: dist
          if-no-files-found: error
          retention-days: 90
