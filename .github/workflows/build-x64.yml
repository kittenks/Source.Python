name: Build Source.Python x86-64 (experimental)

# Experimental x86-64 pipeline. It is dispatch-only on purpose: it must never
# start a run by itself, and it does not exist on the master branch, so the
# 32-bit build-packages pipeline keeps its own matrix and release gating.
# Merge into build-packages.yml only once a game's x86-64 runtime is verified
# on a real server.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Game branch to build for x86-64'
        required: false
        default: hl2dm
        type: choice
        options:
          - hl2dm
          - tf2
          - css
          - dods
      github_proxy:
        description: 'Optional public GitHub proxy, for example https://ghfast.top'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: source-python-x64-${{ github.ref }}-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  build-x64:
    name: Build ${{ inputs.branch }} x86-64 (${{ matrix.target.platform }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux only for now. src/CMakeLists.txt hard-fails x86_64 unless the
        # platform is UNIX and the branch is one of the games whose pinned
        # HL2SDK revision carries lib/**/linux64/tier1.a, and the third-party
        # trees carry lib/linux64 for boost, dyncall, DynamicHooks and AsmJit
        # but no win64 counterpart. Add the windows-2022 target back once win64
        # dependencies and a win64 CPython are in place; the -Architecture
        # plumbing in build-windows.ps1 is already in place for that.
        target:
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.target.os }}
    env:
      SP_GITHUB_PROXY: ${{ inputs.github_proxy }}
      SP_BRANCH: ${{ inputs.branch }}
    steps:
      - name: Check out Source.Python
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Record checked-out source revision
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          "SOURCEPYTHON_SOURCE_REVISION=$revision" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Report the resolved SDK pin
        shell: pwsh
        run: |
          $pins = Get-Content -LiteralPath ./scripts/ci/sdk-pins.json -Raw | ConvertFrom-Json
          $entry = $pins.PSObject.Properties[$env:SP_BRANCH].Value
          "branch        : $env:SP_BRANCH"
          "sdk commit    : $($entry.commit)"
          "sdk_lib       : $($entry.sdk_lib)"
          "sdk_lib_linux : $($entry.sdk_lib_linux)"
          "sdk_lib_win64  : $($entry.sdk_lib_win64)"
          "sdk_lib_linux64: $($entry.sdk_lib_linux64)"

      - name: Verify Source.Python fixes
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./scripts/ci/verify-fixes.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE

      - name: Verify shell script line endings
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if grep -Il $'\r' src/Build.sh scripts/ci/*.sh; then
            echo 'Shell scripts must use LF line endings.' >&2
            exit 1
          fi

      # No gcc-multilib and no i386 architecture: this job links 64-bit objects
      # only. The 32-bit runtime dependency check in build-packages.yml greps
      # for libffi.so.7, which is the i386 SONAME and does not apply here.
      - name: Install Linux x86-64 build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make binutils file unzip

      - name: Fetch pinned HL2SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mirror = $env:SP_GITHUB_PROXY
          .\scripts\ci\fetch-hl2sdk.ps1 -Branch $env:SP_BRANCH -MirrorBase $mirror

      - name: Fetch pinned HL2SDK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/ci/fetch-hl2sdk.sh "$SP_BRANCH"

      - name: Build Windows x86-64
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci\build-windows.ps1 -Branch $env:SP_BRANCH -Architecture x86_64

      - name: Build Linux x86-64
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash ./scripts/ci/build-linux.sh "$SP_BRANCH" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/src/Builds/Linux/$SP_BRANCH-x86_64" \
            "$GITHUB_WORKSPACE/artifacts/native" \
            x86_64

      # build-linux.sh already hard-fails on a non-ELF64 image; these re-check
      # the exact pair of files that get uploaded and record their hashes.
      - name: Verify Windows binaries are x86-64 PE images
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path $env:GITHUB_WORKSPACE "artifacts\native\$env:SP_BRANCH\windows-x86_64"
          foreach ($name in @('core.dll', 'source-python.dll')) {
            $path = Join-Path $directory $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "$name was not produced at '$path'."
            }
            $stream = [IO.File]::OpenRead($path)
            try {
              $reader = New-Object IO.BinaryReader($stream)
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4
              $machine = $reader.ReadUInt16()
            }
            finally {
              $stream.Dispose()
            }
            if ($machine -ne 0x8664) {
              throw "$name is not an x86-64 PE image (machine 0x{0:x})." -f $machine
            }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$name x86-64 PE machine=0x{0:x} sha256=$hash" -f $machine
          }
          Write-Host '--- build-info.json ---'
          Get-Content -LiteralPath (Join-Path $directory 'build-info.json')

      - name: Verify Linux binaries are 64-bit ELF images
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          directory="artifacts/native/$SP_BRANCH/linux-x86_64"
          for name in core.so source-python.so; do
            test -f "$directory/$name"
            description="$(file -b "$directory/$name")"
            case "$description" in
              *"ELF 64-bit"*) ;;
              *) echo "$name is not a 64-bit ELF image: $description" >&2; exit 1 ;;
            esac
            echo "$name: $description"
            readelf -h "$directory/$name" | grep -E 'Class:|Machine:'
            sha256sum "$directory/$name"
          done
          echo '--- build-info.json ---'
          cat "$directory/build-info.json"

      # The 32-bit pipeline pins libffi.so.7, which is the i386 SONAME and does
      # not apply here. Measured on the first green x86-64 run (36242813920),
      # the 64-bit _ctypes links only libc: CPython's manylinux build links
      # libffi statically. Asserted rather than reported, because an unresolved
      # dependency here is a real packaging failure, not an informational fact.
      #
      # There is deliberately no fallback to the 32-bit lib-dynload directory.
      # Both directories hold modules named _ctypes.cpython-313-x86_64-linux-gnu.so
      # -- that tag is the 32-bit libpython's own SOABI, verified by extracting
      # the string from plat-linux/libpython3.13.so.1.0 -- so the filename alone
      # cannot tell the architectures apart. Only the ELF header can. The two
      # directories were checked directly: lib-dynload/_ctypes is ELF32 EM_386
      # and lib-dynload-linux64/_ctypes is ELF64 EM_X86_64. Falling back would
      # therefore ldd a 32-bit image here, and the missing-dependency check
      # would pass while proving nothing about the 64-bit runtime.
      - name: Verify x86-64 runtime dependencies resolve
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dynload="addons/source-python/Python3/lib-dynload-linux64"
          if [ ! -d "$dynload" ]; then
            echo "Missing the x86-64 extension module directory: $dynload" >&2
            exit 1
          fi
          ctypes_module="$(find "$dynload" -maxdepth 1 -name '_ctypes*.so' -print -quit)"
          echo "dynload dir : $dynload"
          if [ -z "$ctypes_module" ]; then
            echo "No _ctypes module found in $dynload; the runtime is incomplete." >&2
            exit 1
          fi
          echo "module      : $ctypes_module"
          file -b "$ctypes_module" | sed 's/^/  /'
          if ! readelf -h "$ctypes_module" | grep -q 'Class:.*ELF64'; then
            echo "$ctypes_module is not an ELF64 image; this is the wrong architecture." >&2
            exit 1
          fi
          LD_LIBRARY_PATH="$PWD/addons/source-python/Python3/plat-linux64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ldd "$ctypes_module" | tee /tmp/source-python-x64-ctypes-ldd.txt
          if grep -qi 'not found' /tmp/source-python-x64-ctypes-ldd.txt; then
            echo 'x86-64 _ctypes has unresolved shared library dependencies.' >&2
            exit 1
          fi
          echo 'All x86-64 _ctypes dependencies resolved.'

      - name: List the packaged x86-64 Python runtime
        shell: bash
        run: |
          set -euo pipefail
          # No pipe into head here. The runner invokes this script as
          # `bash -e -o pipefail` regardless of the `set` line, so `ls | head`
          # makes ls die on SIGPIPE once head has read enough, and -e turns
          # that into a step failure. Whether it happens depends on how the
          # listing splits across head's buffer, which is why it looks flaky:
          # runs 36246268853 (css) and 36246273214 (dods) failed on this while
          # 36246264297 (tf2) passed with identical content. Bound the listing
          # with ls's own head option instead, which cannot signal a pipe.
          for dir in addons/source-python/Python3/plat-linux64 addons/source-python/Python3/lib-dynload-linux64; do
            echo "=== $dir ==="
            if [ -d "$dir" ]; then
              ls -la --time-style=long-iso -lh "$dir"
            else
              echo "(missing)"
            fi
          done

      - name: Upload x86-64 native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-x64-${{ inputs.branch }}-${{ matrix.target.platform }}
          path: artifacts/native
          if-no-files-found: error
          retention-days: 30

  package-x64:
    name: Package and verify the ${{ inputs.branch }} x86-64 archive
    needs: build-x64
    # windows-2022 because package.ps1 and verify-packages.ps1 use tar.exe, which
    # only exists on the Windows runner. The x86-64 binaries themselves are built
    # on ubuntu; this job only packs and checks them.
    runs-on: windows-2022
    env:
      # Job-scoped, so it has to be restated here: the build job's SP_BRANCH does
      # not carry across a job boundary.
      SP_BRANCH: ${{ inputs.branch }}
    steps:
      - name: Check out Source.Python
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Pin the build date
        shell: pwsh
        run: |
          # Both scripts default to the current date independently, so a run that
          # crosses midnight between packaging and verification would look for an
          # archive name that was never written. Pin it once and share it.
          $date = [DateTime]::Now.ToString('yyyy-MMdd')
          "SOURCEPYTHON_BUILD_DATE=$date" | Add-Content -LiteralPath $env:GITHUB_ENV
          "build date: $date"

      - name: Download the x86-64 native binaries
        uses: actions/download-artifact@v4
        with:
          # Name the artifact outright rather than using pattern: native-*. The
          # build job names it with matrix.target.platform, which is plain
          # "linux" even though the binaries inside are x86-64, so the token here
          # has to match that and not the linux-x86_64 directory name.
          name: native-x64-${{ inputs.branch }}-linux
          path: artifacts/native

      - name: Assemble the x86-64 archive
        shell: pwsh
        run: |
          .\scripts\ci\package.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -NativeRoot (Join-Path $env:GITHUB_WORKSPACE 'artifacts\native') `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist') `
            -Branches $env:SP_BRANCH `
            -RequiredPlatforms @('linux-x86_64')

      - name: Verify the assembled archive
        shell: pwsh
        run: |
          # This is where the new architecture assertion runs: it reads the ELF
          # class out of the packaged core.so and fails if it is not ELF64, so an
          # x86-32 artifact cannot ship inside an archive labelled x86-64.
          .\scripts\ci\verify-packages.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist') `
            -Branches $env:SP_BRANCH `
            -RequiredPlatforms @('linux-x86_64') `
            -SkipSourceArchive

      - name: Upload the x86-64 archive
        uses: actions/upload-artifact@v4
        with:
          name: source-python-x64-${{ inputs.branch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
