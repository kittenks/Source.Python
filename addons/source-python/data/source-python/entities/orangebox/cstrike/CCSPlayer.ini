[function]

    [[add_account]]
        identifier_windows = 55 8B EC 83 EC 18 89 4D FC 8D 45 08
        identifier_linux = _ZN9CCSPlayer10AddAccountEibbPKc
        arguments = INT, BOOL, BOOL, STRING

    [[autobuy]]
        identifier_windows = 55 8B EC 83 EC 0C 89 4D F8 8B 4D F8 E8
        identifier_linux = _ZN9CCSPlayer7AutoBuyEv

    [[buy_internal]]
        identifier_windows = 55 8B EC 83 EC 28 89 4D F8 6A 00
        # Windows x86-64, against cstrike/bin/x64/server.dll build 25338297.
        #
        # Found by the string bridge: the 32-bit signature locates the function,
        # the strings it references are content and so survive the recompile, and
        # the x64 functions referencing those strings are ranked by how many
        # distinct ones they hold, weighted by rarity. Then checked a second
        # time by evidence unrelated to the ranking, because an earlier run of the
        # same method "passed" add_account for the wrong reason and only tighter
        # function bounds exposed it.
        #
        #   32-bit 0x292400, 1246 bytes, 13 strings, 24 direct calls
        #   64-bit 0x30AB10, 1731 bytes, 16 strings, 25 direct calls
        #   all 13 of the 32-bit strings are present; none is missing
        #   the 3 extra x64 strings are weapon_flashbang, weapon_hegrenade and
        #   weapon_smokegrenade, i.e. weapons this build added after the ini was
        #   written - the build id here is far newer than on the TF2 side
        #
        # Matches exactly once in the x64 image and zero times in the 32-bit one.
        identifier_windows_x86_64 = 48 89 54 24 2A 48 89 4C 24 08 48 81 EC 2A 2A 2A 2A 33 D2 48 8B 8C 24 2A 2A 2A 2A E8 60
        identifier_linux = _ZN9CCSPlayer26HandleCommand_Buy_InternalEPKc
        arguments = STRING
        return_type = INT

    [[rebuy]]
        identifier_windows = 55 8B EC 81 EC 10 01 2A 2A 89 4D FC
        # Windows x86-64, same method and same second check as buy_internal.
        # The two functions are the cleanest pair in this file: the string sets
        # are identical in both directions, with nothing on either side that the
        # other lacks.
        #
        #   32-bit 0x298590, 770 bytes, 13 strings, 15 direct calls
        #   64-bit 0x312A60, 959 bytes, 13 strings, 15 direct calls
        #   13 shared, 0 only-in-32-bit, 0 only-in-x64
        identifier_windows_x86_64 = 48 89 4C 24 08 48 81 EC 2A 2A 2A 2A 48 8B 8C 24 2A 2A 2A 2A E8 F7
        identifier_linux = _ZN9CCSPlayer5RebuyEv

    [[deafen]]
        identifier_windows = 55 8B EC 83 EC 28 89 4D FC 8B 45 FC 8B 10
        identifier_linux = _ZN9CCSPlayer6DeafenEf
        arguments = FLOAT

    [[switch_team]]
        identifier_windows = 55 8B EC 83 EC 5C 89 4D FC
        identifier_linux = _ZN9CCSPlayer10SwitchTeamEi
        arguments = INT


[virtual_function]

    # _ZN9CCSPlayer12Weapon_EquipEP17CBaseCombatWeapon
    [[equip_weapon]]
        offset_linux = 269
        offset_windows = 268
        arguments = POINTER

    # _ZN9CCSPlayer5BlindEfff
    [[blind]]
        offset_linux = 480
        offset_windows = 477
        arguments = FLOAT, FLOAT, FLOAT


