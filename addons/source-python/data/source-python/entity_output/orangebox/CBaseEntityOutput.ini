# ../data/source-python/entity_output/orangebox/CBaseEntityOutput.ini

binary = server

[function]
    [[fire_output]]
        identifier_linux = _ZN17CBaseEntityOutput10FireOutputE9variant_tP11CBaseEntityS2_f
        # Reference string: (%0.2f) output: (%s,%s) -> (%s,%s,%.1f)
        identifier_windows = 55 8B EC 81 EC 40 01 00 00 8B C1 53
        # Windows x86-64. Derived from the prologue of the function the reference
        # string above is used from, at RVA 0x28EE20 in tf/bin/x64/server.dll
        # (build 24245063). Verified with Source.Python's own search algorithm
        # replicated line for line from CBinaryFile::FindSignatureRaw, which
        # reproduces the known-good 32-bit answer 0x225CE0 first: exactly one
        # match in the loaded image, and zero in the 32-bit image.
        #
        #   48 8B C4              mov  rax, rsp
        #   48 89 50 2A           mov  [rax+?], rdx        2A = the displacement
        #   48 89 48 08           mov  [rax+0x08], rcx
        #   41 54 41 55 41 56 41 57  push r12, r13, r14, r15
        #   48 81 EC 2A 2A 2A 2A  sub  rsp, ?            2A = the frame size
        #
        # The wildcards are the only two build-specific values, and both positions
        # were derived from the instruction encoding rather than written by hand.
        # An earlier attempt had them the wrong way round - opcodes wildcarded,
        # frame size literal - and still matched exactly once, so uniqueness on
        # its own does not prove a pattern is sensible.
        # The key is <name>_<platform>_<architecture>, i.e. identifier_windows_x86_64,
        # because parse_data() builds it as key + '_' + PLATFORM + '_' + ARCHITECTURE
        # with PLATFORM = system().lower() and ARCHITECTURE = 'x86_64' if
        # sys.maxsize > 2**32 else 'x86'. A key written as identifier_windows_x64
        # is silently never read: the file looks correct and the x64 build keeps
        # resolving the 32-bit signature.
        identifier_windows_x86_64 = 48 8B C4 48 89 50 2A 48 89 48 08 41 54 41 55 41 56 41 57 48 81 EC 2A 2A 2A 2A
        # arguments_* is deliberately not duplicated for x86_64: the C++
        # parameter types are unchanged, and on Windows x86-64 CDECL and THISCALL
        # both resolve to the single Microsoft x64 convention in
        # MakeDynamicHooksConvention, so arguments_windows is inherited as-is.
        arguments_linux = POINTER, POINTER, POINTER, FLOAT
        arguments_windows = INT, INT, INT, INT, POINTER, POINTER, POINTER, FLOAT
